spring:
  application:
    name: barberbook-backend

  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/barberbook}}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:barberbook}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:barberbook_dev}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: America/Sao_Paulo

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  time-zone: America/Sao_Paulo

  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  frontend:
    success-url: ${FRONTEND_SUCCESS_URL:http://localhost:5173/checkout/sucesso}
    cancel-url: ${FRONTEND_CANCEL_URL:http://localhost:5173/checkout/cancelado}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

  admin:
    name: ${ADMIN_NAME:Administrador}
    email: ${ADMIN_EMAIL:admin@barberbook.local}
    password: ${ADMIN_PASSWORD}

  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

  brasil-api:
    base-url: https://brasilapi.com.br

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    document-title: BarberBook API

logging:
  level:
    root: INFO
    com.barberbook.backend: INFO
