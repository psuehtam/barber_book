spring:
  application:
    name: barberbook-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/barberbook}
    username: ${SPRING_DATASOURCE_USERNAME:barberbook}
    password: ${SPRING_DATASOURCE_PASSWORD:barberbook_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
